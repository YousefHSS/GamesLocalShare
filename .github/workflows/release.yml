name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write  # required by softprops/action-gh-release to create the release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: WebUI/package-lock.json

    - name: Install WebUI dependencies
      run: npm ci
      working-directory: WebUI

    - name: Restore dependencies
      run: dotnet restore GamesLocalShare.csproj

    # Framework-dependent: disable trimming and single-file packaging. Trimming requires
    # self-contained, and single-file is unnecessary when the user already has .NET 8.
    - name: Build Release (Framework-Dependent)
      run: dotnet publish GamesLocalShare.csproj -c Release -r win-x64 --self-contained false -p:PublishTrimmed=false -p:PublishSingleFile=false -o ./publish-fd

    # Self-contained: let it land at the default bin\Release\net8.0\win-x64\publish path
    # so installer.iss can pick it up without modification. SingleFile is explicitly
    # disabled because it breaks WebView2's native loader (renders pure black).
    - name: Build Release (Self-Contained)
      run: dotnet publish GamesLocalShare.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false
      
    - name: Create ZIP (Framework-Dependent)
      run: Compress-Archive -Path ./publish-fd/* -DestinationPath GamesLocalShare-win-x64-fd.zip
      
    - name: Create ZIP (Self-Contained)
      run: Compress-Archive -Path ./bin/Release/net8.0/win-x64/publish/* -DestinationPath GamesLocalShare-win-x64-sc.zip
      
    - name: Download Inno Setup
      run: |
        choco install innosetup -y
        
    - name: Build Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      
    - name: Get version from tag
      id: get_version
      run: |
        $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          GamesLocalShare-win-x64-fd.zip
          GamesLocalShare-win-x64-sc.zip
          installer_output/GamesLocalShare-Setup-*.exe
        body: |
          ## Downloads
          
          ### Framework-Dependent (Requires .NET 8)
          - **GamesLocalShare-win-x64-fd.zip** (~15MB)
          - Requires [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)
          
          ### Self-Contained (app needs no .NET)
          - **GamesLocalShare-win-x64-sc.zip** (~60MB)
          - The app itself bundles the runtime. Note: the optional Xbox skeleton tool (xvdtool) is
            framework-dependent, so skeleton capture still needs the .NET 8 Runtime.
          
          ### Installer
          - **GamesLocalShare-Setup-*.exe**
          - Windows installer with automatic .NET check
          - Creates Start Menu shortcuts
          - Optional: Start with Windows (registers an elevated logon task so the app starts without a UAC prompt each session)

          ## What's New in 3.1.0

          Two fixes to receiving an Xbox game from a drive: you pick the folder once, and the transfer bar now ends when the install does.

          - **Fixed: the folder picker opened two or three times in a row** — every time the window was closed to the tray and reopened, the app built a second connection to its own interface without dropping the first, so each button press was delivered once per restore. "Receive Xbox Game" made that visible: pick a folder, and the picker immediately reappeared, once per extra connection. The connection is now built once for the lifetime of the window, and only one folder picker can ever be on screen at a time.
          - **Fixed: the transfer bar sat on "click Install in the Xbox app" after the game had installed** — finishing the transfer relied on spotting the finished install under a watched Xbox folder, which never happened if the game was installed to a drive the app wasn't watching, and was skipped outright when the title was already known (a re-install or an update). The bar now also finishes on its own once the Xbox app stops asking for the package — a minute after the last byte for a completed package — and a completed re-install is recognised as one.

          Rebuilding a stored game back into its original package now works. This was the missing half of single-copy storage: the app could shrink a game to its installed files plus a ~17 MB skeleton, but turning that back into the package Xbox asks for during a Verify or an update failed every time — so the space saving was never safe to rely on.

          - **Fixed: restoring a game from its skeleton always failed at the last step** — the rebuild itself was perfect (the app confirmed a byte-identical result every time), but the final re-encryption silently did nothing, and the restore was rejected as "does not match the genuine package". The re-encryption step was written for an older skeleton format; on the current one it saw a package that already looked encrypted and quietly declined, leaving the file unencrypted. Restoring now takes a single path built for the current format, which never rewrites the package header at all — so there is nothing to re-sign and nothing to get out of step. Verified byte-identical on a 316 MB game and a 4.3 GB one.
          - **Clearer logs when a restore fails** — every restore printed "Warning: CIK could not be loaded!", including successful steps, which read like the cause of the failure and it never was. That warning now appears only when it's real; a genuinely missing key is still named explicitly.

          Large games can now be captured at all — end to end, from download to finished skeleton. Preparing a capture drops from over three minutes to about a second, a finished capture no longer gets stranded waiting to be saved, and the app tells you what it's doing while it works.

          - **Fixed: a finished capture could sit unsaved forever** — once a game's download completed, the skeleton was held until the game finished installing, and the only two things that would then save it were a one-off event and a poll that gave up after 15 minutes. If the game finished installing before its capture was ready, both windows closed and the finished skeleton was never written — while the app reported every 10 minutes that no package was available, suggesting you route the download through the proxy, which you already had. Smaller games appeared to work only because they finished inside the 15-minute window. Saving is now retried indefinitely.
          - **Now shows what it's doing while finalizing** — saving a skeleton matches it against the installed game and refetches anything the Store never sent, which takes minutes on a large game and previously produced no output at all. It now reports when it starts, progress as it goes, and how long it took — and reports failures, which used to be silent.
          - **Lower memory while a capture waits to be saved** — the two large buffers a waiting capture held (~380 MB for a 27 GB game) now live on disk instead of in memory.
          - **Quieter log** — the 10-minute scan no longer re-lists every game that's waiting for a package on every pass; it reports each one once, and again only if something changes.

          - **Fixed: capture still gave up on large games** — 3.0.12 made reading a game's file layout ~400x faster (203s to 0.5s), but that only exposed the real cost: the app was also parsing a table with one entry per 4 KB of the package — nearly 7 million entries for a 27 GB game — that capture never actually uses. It's now skipped. That accounted for 184 of the 185 seconds spent preparing a capture, which was the whole reason the download outran it.
          - **Fixed: download throttling switched itself off almost immediately** — the limit on how long a download may be slowed was being measured by adding up time across all connections, but a Store download runs ~8 connections that pause together, so a 60-second allowance was spent in about 8 seconds of real time. It's now measured as elapsed time, as intended, and the log no longer repeats the same line dozens of times per second.

          - **Capture no longer abandons itself when it falls behind** — if the capture can't keep pace for a moment, the download is now held back very briefly (tens of milliseconds at a time) so it can catch up, rather than dropping data and abandoning the skeleton. There are hard limits on this: any single pause is capped, and once a game's download has been slowed by 60 seconds in total the throttling stops permanently and the old behaviour resumes. A game finishing correctly always takes priority over capturing it.
          - **Fixed: ~1.7 GB of memory held after a capture was abandoned** — a given-up capture kept its entire buffer alive until the app happened to clean up. Buffers are now released immediately.
          - **Fixed: captures of large games abandoned during a normal download lull** — a game whose download pauses briefly (the Store interleaves several files) could have its capture discarded after 30 seconds and reported as "an update reusing local blocks", which was simply wrong. Large games take longer to prepare and are far more exposed to this, so the wait is now much longer and the message says what actually happened.

          ## What's New in 3.0.12

          Makes preparing a capture ~100x faster, which is what large games were actually blocked on.

          - **Fixed: capture gave up ~30 seconds after starting, on large games** — before a capture can begin it reads the package's file layout, and that step took **203 seconds** on a 27 GB game. The download keeps running throughout, so by the time capture was ready the download had raced minutes ahead of it and the capture immediately fell over trying to catch up ("reorder buffer overflow"). The cause was that decryption rebuilt its cipher from scratch for every 4 KB page read — thousands of times over — instead of once per package region. It's now built once and reused, verified to produce byte-identical output. Small games were unaffected because their layout is read in a second or two.

          ## What's New in 3.0.11

          Makes skeleton capture work on large games. Games above roughly 11 GB could never be captured before this release.

          - **Fixed: games above ~11 GB could never build a skeleton** — the capture buffered a fixed 64 MB from the front of a package before starting, but the point it actually has to reach grows with package size (it sits past the package's hash tree, which is about 1/169 of the total). That's ~22 MB into a 3.7 GB game but ~158 MB into a 27 GB one, so on large games the capture was reading past the end of what it had and failed with "no partition table". The required amount is now read from the package's own header and buffered before arming. Worse, the old shortfall failed *quietly* first — it could yield an all-zero content key — so that case is now rejected outright rather than captured wrong.
          - **Fixed: capture given up the instant it started, on large games** — arming a big package takes minutes, and the download keeps running throughout, so over a GB of buffered bytes were handed to the capture at once and instantly tripped its backlog limit. Those bytes are already in memory (they move, rather than being copied), so the limit now accounts for them instead of discarding the capture to defend a ceiling already crossed.
          - **Bounded memory while arming** — the pre-arm buffer no longer grows without limit during a slow arm; past its cap those ranges are fetched later when the skeleton is finalized.
          - **Clearer logs** — capture now records the front size it computed and why, a timing breakdown of the arming phases, and, when a front never completes, what was actually reached. Previously that last case was always reported as "an update reusing local blocks", which was often simply wrong.

          Everything else from 3.0.10 carries over unchanged:

          - **Fixed: big titles gave up capture the instant they started it** — the content key is now fetched in the background as the download begins, rather than blocking the arming step for 10-25 seconds.

          And from 3.0.9:

          - **Fixed: Xbox installs frozen at 100% with the app idle** — the streaming-capture finalizer no longer holds a lock while fetching the last bytes from the CDN, which previously deadlocked the proxy.

          And from 3.0.8:

          - **Streaming capture is the default** — a game's skeleton is built straight from its install download (no full encrypted package written to disk). If capture can't run for a title, it's simply skipped that time — the install is never affected.
          - **Optional setting: "Also cache the full package to disk"** — off by default; keeps a full byte-for-byte package copy for other PCs on your LAN (uses a lot of disk) and acts as the capture fallback.
          - **Updates no longer re-download the game** — an update to an installed game is just forwarded; the app doesn't pull the rest of the package to rebuild a skeleton.
          - **Silent key extraction** — the CikExtractor console window no longer appears during key refresh.

          Underlying 3.0.x Xbox features (LAN transfer, single-copy storage, download cache, prompt-free elevated startup) are unchanged.

          > **Note:** the Xbox MSIXVC features depend on [xvdtool](https://github.com/emoose/xvdtool) (emoose), [CikExtractor](https://github.com/LukeFZ/CikExtractor) (LukeFZ), and helper scripts that are **not redistributed** in these builds. Steam/Epic library management, LAN discovery/transfer, and sync work out of the box. See the README for setup.

          ## Acknowledgments

          The Xbox transfer and single-copy features build on two excellent open-source tools, used to decrypt and rebuild content you already own — huge thanks to their authors:
          - **[xvdtool](https://github.com/emoose/xvdtool)** by emoose
          - **[CikExtractor](https://github.com/LukeFZ/CikExtractor)** by LukeFZ

          ## System Requirements
          - Windows 10 or later (64-bit)
          - .NET 8 Desktop Runtime (for framework-dependent version)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
