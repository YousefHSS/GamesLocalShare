name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write  # required by softprops/action-gh-release to create the release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: WebUI/package-lock.json

    - name: Install WebUI dependencies
      run: npm ci
      working-directory: WebUI

    - name: Restore dependencies
      run: dotnet restore GamesLocalShare.csproj

    # Framework-dependent: disable trimming and single-file packaging. Trimming requires
    # self-contained, and single-file is unnecessary when the user already has .NET 8.
    - name: Build Release (Framework-Dependent)
      run: dotnet publish GamesLocalShare.csproj -c Release -r win-x64 --self-contained false -p:PublishTrimmed=false -p:PublishSingleFile=false -o ./publish-fd

    # Self-contained: let it land at the default bin\Release\net8.0\win-x64\publish path
    # so installer.iss can pick it up without modification. SingleFile is explicitly
    # disabled because it breaks WebView2's native loader (renders pure black).
    - name: Build Release (Self-Contained)
      run: dotnet publish GamesLocalShare.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false
      
    - name: Create ZIP (Framework-Dependent)
      run: Compress-Archive -Path ./publish-fd/* -DestinationPath GamesLocalShare-win-x64-fd.zip
      
    - name: Create ZIP (Self-Contained)
      run: Compress-Archive -Path ./bin/Release/net8.0/win-x64/publish/* -DestinationPath GamesLocalShare-win-x64-sc.zip
      
    - name: Download Inno Setup
      run: |
        choco install innosetup -y
        
    - name: Build Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      
    - name: Get version from tag
      id: get_version
      run: |
        $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          GamesLocalShare-win-x64-fd.zip
          GamesLocalShare-win-x64-sc.zip
          installer_output/GamesLocalShare-Setup-*.exe
        body: |
          ## Downloads
          
          ### Framework-Dependent (Requires .NET 8)
          - **GamesLocalShare-win-x64-fd.zip** (~15MB)
          - Requires [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)
          
          ### Self-Contained (app needs no .NET)
          - **GamesLocalShare-win-x64-sc.zip** (~60MB)
          - The app itself bundles the runtime. Note: the optional Xbox skeleton tool (xvdtool) is
            framework-dependent, so skeleton capture still needs the .NET 8 Runtime.
          
          ### Installer
          - **GamesLocalShare-Setup-*.exe**
          - Windows installer with automatic .NET check
          - Creates Start Menu shortcuts
          - Optional: Start with Windows (registers an elevated logon task so the app starts without a UAC prompt each session)

          ## What's New in 3.0.11

          Makes skeleton capture work on large games. Games above roughly 11 GB could never be captured before this release.

          - **Fixed: games above ~11 GB could never build a skeleton** — the capture buffered a fixed 64 MB from the front of a package before starting, but the point it actually has to reach grows with package size (it sits past the package's hash tree, which is about 1/169 of the total). That's ~22 MB into a 3.7 GB game but ~158 MB into a 27 GB one, so on large games the capture was reading past the end of what it had and failed with "no partition table". The required amount is now read from the package's own header and buffered before arming. Worse, the old shortfall failed *quietly* first — it could yield an all-zero content key — so that case is now rejected outright rather than captured wrong.
          - **Fixed: capture given up the instant it started, on large games** — arming a big package takes minutes, and the download keeps running throughout, so over a GB of buffered bytes were handed to the capture at once and instantly tripped its backlog limit. Those bytes are already in memory (they move, rather than being copied), so the limit now accounts for them instead of discarding the capture to defend a ceiling already crossed.
          - **Bounded memory while arming** — the pre-arm buffer no longer grows without limit during a slow arm; past its cap those ranges are fetched later when the skeleton is finalized.
          - **Clearer logs** — capture now records the front size it computed and why, a timing breakdown of the arming phases, and, when a front never completes, what was actually reached. Previously that last case was always reported as "an update reusing local blocks", which was often simply wrong.

          Everything else from 3.0.10 carries over unchanged:

          - **Fixed: big titles gave up capture the instant they started it** — the content key is now fetched in the background as the download begins, rather than blocking the arming step for 10-25 seconds.

          And from 3.0.9:

          - **Fixed: Xbox installs frozen at 100% with the app idle** — the streaming-capture finalizer no longer holds a lock while fetching the last bytes from the CDN, which previously deadlocked the proxy.

          And from 3.0.8:

          - **Streaming capture is the default** — a game's skeleton is built straight from its install download (no full encrypted package written to disk). If capture can't run for a title, it's simply skipped that time — the install is never affected.
          - **Optional setting: "Also cache the full package to disk"** — off by default; keeps a full byte-for-byte package copy for other PCs on your LAN (uses a lot of disk) and acts as the capture fallback.
          - **Updates no longer re-download the game** — an update to an installed game is just forwarded; the app doesn't pull the rest of the package to rebuild a skeleton.
          - **Silent key extraction** — the CikExtractor console window no longer appears during key refresh.

          Underlying 3.0.x Xbox features (LAN transfer, single-copy storage, download cache, prompt-free elevated startup) are unchanged.

          > **Note:** the Xbox MSIXVC features depend on [xvdtool](https://github.com/emoose/xvdtool) (emoose), [CikExtractor](https://github.com/LukeFZ/CikExtractor) (LukeFZ), and helper scripts that are **not redistributed** in these builds. Steam/Epic library management, LAN discovery/transfer, and sync work out of the box. See the README for setup.

          ## Acknowledgments

          The Xbox transfer and single-copy features build on two excellent open-source tools, used to decrypt and rebuild content you already own — huge thanks to their authors:
          - **[xvdtool](https://github.com/emoose/xvdtool)** by emoose
          - **[CikExtractor](https://github.com/LukeFZ/CikExtractor)** by LukeFZ

          ## System Requirements
          - Windows 10 or later (64-bit)
          - .NET 8 Desktop Runtime (for framework-dependent version)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
